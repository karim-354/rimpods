<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Demo: Comet Head Dot — Mythos Throughline</title>
<style>
  body { margin:0; background:#06222e; height:100vh; overflow:hidden; font-family:sans-serif; }
  .label { position:fixed; top:24px; left:50%; transform:translateX(-50%); color:#9fe8df; font-size:14px; letter-spacing:.2em; text-transform:uppercase; opacity:.7 }
  svg { position:fixed; inset:0; width:100vw; height:100vh; }
  .line { fill:none; stroke:url(#g); stroke-width:4; stroke-linecap:round; }
  .halo { fill:none; stroke:url(#g); stroke-width:12; stroke-linecap:round; opacity:.42; filter:blur(7px); }

  /* === KEPALA GARIS: dot kelap-kelip === */
  .dot-core { fill:#fff; }
  .dot-glow { fill:#F5C542; filter:blur(8px); animation: twinkle 1.6s ease-in-out infinite; }
  .dot-ring { fill:none; stroke:#F5C542; stroke-width:3; animation: ripple 1.6s ease-out infinite; }
  .dot-core { animation: corePulse 1.6s ease-in-out infinite; }

  @keyframes twinkle {
    0%,100% { opacity:.35; r:9; }
    50%     { opacity:1; r:15; }
  }
  @keyframes corePulse {
    0%,100% { r:5; }
    50%     { r:7; }
  }
  @keyframes ripple {
    0%   { r:8;  opacity:1; stroke-width:3; }
    100% { r:38; opacity:0; stroke-width:.5; }
  }
</style>
</head>
<body>
<div class="label">Contoh: kepala garis dengan dot kelap-kelip (comet head)</div>
<svg viewBox="0 0 1920 800" preserveAspectRatio="none">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#35DBC9"/>
      <stop offset="70%" stop-color="#F4604A"/>
      <stop offset="100%" stop-color="#F5C542"/>
    </linearGradient>
  </defs>
  <!-- garis tergambar 65%, ujungnya di tengah layar -->
  <path class="halo" d="M 960 -50 C 960 150, 760 200, 760 360 C 760 480, 1100 500, 1060 640" pathLength="100" stroke-dasharray="100" stroke-dashoffset="35"/>
  <path class="line" d="M 960 -50 C 960 150, 760 200, 760 360 C 760 480, 1100 500, 1060 640" pathLength="100" stroke-dasharray="100" stroke-dashoffset="35"/>
  <!-- kepala: ring ripple + glow + core (posisi = ujung garis di 65%) -->
  <g id="head">
    <circle class="dot-ring" cx="0" cy="0" r="6"/>
    <circle class="dot-glow" cx="0" cy="0" r="7"/>
    <circle class="dot-core" cx="0" cy="0" r="4"/>
  </g>
</svg>
<script>
  // letakkan kepala persis di ujung garis yang tergambar (65% dari panjang path)
  const line = document.querySelector('.line');
  const len = line.getTotalLength();
  const tip = line.getPointAtLength(len * 0.65);
  const head = document.getElementById('head');
  head.setAttribute('transform', `translate(${tip.x}, ${tip.y})`);
</script>
</body>
</html>
